name: AegisOps Task 1 Checks

on:
  push:
    branches:
      - "fix/nov1-task1-auth-verification"
  pull_request:
    branches:
      - "aegisops-v2"

jobs:
  test-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip Flask psutil
      - name: Run Task 1 tests
        run: python -m unittest discover -s tests -v
      - name: Compile changed Python files
        run: >-
          python -m py_compile
          agent/agent.py
          core/agent_client.py
          core/monitor.py
          register_backend_lab.py
          integrate_svc004_agent.py
          tests/test_agent_auth.py
          tests/test_agent_recovery_verification.py
          tests/test_register_backend_lab.py
