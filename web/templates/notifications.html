<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AegisOps - Notifications</title>
<link rel="stylesheet" href="/static/css/dashboard.css">

<style>
/* AegisOps scroll behavior: LEFT sidebar scrolls independently.
   RIGHT/main content uses the browser's normal page scroll. */
html{
    height:auto !important;
    overflow-x:hidden !important;
    overflow-y:auto !important;
    scrollbar-width:auto !important;
    scrollbar-color:auto !important;
}
body{
    min-height:100vh !important;
    height:auto !important;
    overflow-x:hidden !important;
    overflow-y:visible !important;
}
.main{
    height:auto !important;
    max-height:none !important;
    overflow:visible !important;
}

/* Only the left menu gets its own scroll area */
.sidebar{
    height:100vh !important;
    max-height:100vh !important;
    overflow-y:auto !important;
    overflow-x:hidden !important;
    overscroll-behavior:contain;
    scrollbar-width:thin;
    scrollbar-color:#5f6870 transparent;
}
.sidebar::-webkit-scrollbar{
    width:7px;
}
.sidebar::-webkit-scrollbar-track{
    background:transparent;
}
.sidebar::-webkit-scrollbar-thumb{
    background:#5f6870;
    border-radius:999px;
}
.sidebar::-webkit-scrollbar-thumb:hover{
    background:#8aa6af;
}

/* Do not apply any custom scrollbar styling to the right/main page */
body::-webkit-scrollbar,
html::-webkit-scrollbar{
    width:auto;
}
body::-webkit-scrollbar-track,
html::-webkit-scrollbar-track{
    background:initial;
}
body::-webkit-scrollbar-thumb,
html::-webkit-scrollbar-thumb{
    background:initial;
    border-radius:initial;
}

.sidebar .nav{
    padding-bottom:28px !important;
}
.sidebar .protection{
    flex-shrink:0;
    margin-bottom:18px;
}

@media (max-width:900px){
    .sidebar{
        position:relative !important;
        height:auto !important;
        max-height:none !important;
        overflow:visible !important;
    }
}
</style>




<style>
.notification-list{display:flex;flex-direction:column;gap:14px}
.notification-card{padding:20px 22px;border:1px solid var(--border);border-radius:var(--radius-lg);background:linear-gradient(180deg,rgba(29,29,34,.98),rgba(24,24,28,.98));display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}
.notification-card.unread{border-color:rgba(160,192,201,.34);background:linear-gradient(180deg,rgba(160,192,201,.075),rgba(24,24,28,.98))}
.notification-title{font-size:17px;font-weight:850;color:var(--paper);margin-bottom:7px}
.notification-message{color:var(--text-soft);line-height:1.6}
.notification-meta{margin-top:10px;color:var(--text-muted);font-size:11px}
.severity{display:inline-flex;padding:7px 10px;border-radius:999px;font-size:10px;font-weight:850;border:1px solid var(--border)}
.severity.SUCCESS{color:#A5E7C5;border-color:rgba(112,215,165,.25);background:rgba(112,215,165,.08)}
.severity.WARNING{color:#FFE0B3;border-color:rgba(233,181,103,.25);background:rgba(233,181,103,.08)}
.severity.ERROR{color:#FFC6B9;border-color:rgba(255,90,54,.28);background:rgba(255,90,54,.09)}
.severity.INFO{color:#D3E4E9;border-color:rgba(160,192,201,.24);background:rgba(160,192,201,.08)}
</style>
</head>
<body>

<aside class="sidebar">
<div class="logo">AEGIS<span>OPS</span></div>
<div class="subtitle">Operations Console</div>
<nav class="nav">
<a href="/">Dashboard</a>
<a href="/services">Services</a>
<a href="/incidents">Incidents</a>
<a href="/assistant">Aegis AI</a>
<a href="/notifications" class="active">Notifications</a>
<a href="/infrastructure">Infrastructure</a>
<a href="/settings">Settings</a>
</nav>

</aside>

<main class="main">
<div class="top">
<div>
<h1>Notifications</h1>
<div class="muted">Recovery results, warnings and operational alerts generated by AegisOps.</div>
</div>
<button class="btn btn-secondary" onclick="markAllRead()">Mark all read</button>
</div>

<div class="stats">
<div class="stat">
<div class="label">Total</div>
<div class="value blue" id="total">0</div>
</div>
<div class="stat">
<div class="label">Unread</div>
<div class="value red" id="unread">0</div>
</div>
<div class="stat">
<div class="label">Status</div>
<div class="value green" style="font-size:25px">LIVE</div>
</div>
</div>

<div id="notificationList" class="notification-list">
<div class="empty">Loading notifications...</div>
</div>
</main>

<script>
function escapeHtml(value){
    return String(value??"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

async function loadNotifications(){
    const list=document.getElementById("notificationList");

    try{
        const response=await fetch("/api/notifications");
        const data=await response.json();
        const items=data.notifications||[];

        document.getElementById("total").textContent=data.count??0;
        document.getElementById("unread").textContent=data.unread??0;

        if(!items.length){
            list.innerHTML='<div class="empty">No notifications yet. Recovery and incident alerts will appear here.</div>';
            return;
        }

        list.innerHTML=items.map(item=>`
            <div class="notification-card ${item.read?"":"unread"}">
                <div>
                    <div class="notification-title">${escapeHtml(item.title||"AegisOps Notification")}</div>
                    <div class="notification-message">${escapeHtml(item.message||"")}</div>
                    <div class="notification-meta">
                        ${escapeHtml(item.service_name||"System")}
                        •
                        ${escapeHtml(item.incident_id||"No incident ID")}
                        •
                        ${escapeHtml(item.created_at||"--")}
                    </div>
                </div>
                <div class="severity ${escapeHtml(item.severity||"INFO")}">
                    ${escapeHtml(item.severity||"INFO")}
                </div>
            </div>
        `).join("");

    }catch(error){
        list.innerHTML='<div class="empty">Unable to load notifications.</div>';
    }
}

async function markAllRead(){
    await fetch("/api/notifications/read-all",{method:"POST"});
    await loadNotifications();
}

loadNotifications();
setInterval(loadNotifications,5000);
</script>
</body>
</html>
